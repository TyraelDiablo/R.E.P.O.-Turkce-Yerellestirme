<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 256 256" fill="none">
  <rect width="256" height="256" fill="none"/>
  <!-- Body -->
  <g transform="translate(48,28)">
    <rect x="0" y="0" width="160" height="200" rx="40" fill="#d22b2b" stroke="#b21f1f" stroke-width="3"/>
    <!-- neck ring -->
    <ellipse cx="80" cy="28" rx="62" ry="10" fill="#b21f1f"/>
    <rect x="28" y="28" width="104" height="8" fill="#aa1c1c"/>
    <!-- eyes -->
    <g transform="translate(28,56)">
      <ellipse cx="28" cy="34" rx="24" ry="22" fill="#f6f9fb" stroke="#d0d7db" stroke-width="1"/>
      <circle cx="28" cy="34" r="7" fill="#111"/>
      <ellipse cx="88" cy="34" rx="24" ry="22" fill="#f6f9fb" stroke="#d0d7db" stroke-width="1"/>
      <circle cx="88" cy="34" r="7" fill="#111"/>
    </g>
    <!-- arms -->
    <rect x="-8" y="100" width="28" height="12" rx="6" fill="#c73a3a"/>
    <rect x="140" y="100" width="28" height="12" rx="6" fill="#c73a3a"/>
    <!-- legs (simplified) -->
    <rect x="44" y="170" width="28" height="18" rx="6" fill="#b21f1f"/>
    <rect x="88" y="170" width="28" height="18" rx="6" fill="#b21f1f"/>
    <!-- mouth (small) -->
    <rect x="56" y="118" width="48" height="6" rx="3" fill="#a72a2a"/>
    <!-- flag (right arm holds it) -->
    <g transform="translate(160,68) scale(0.9)">
      <rect x="0" y="0" width="6" height="48" fill="#6b4f3a"/>
      <rect x="8" y="2" width="40" height="28" rx="3" fill="#E30A17"/>
      <g transform="translate(24,16)">
        <circle cx="0" cy="0" r="6.5" fill="#fff"/>
        <circle cx="2.8" cy="0" r="4.7" fill="#E30A17"/>
      </g>
      <polygon points="28,4 30,7 34,7 31,10 32,13 28,11 24,13 25,10 22,7 26,7" fill="#fff" transform="translate(-6,0) scale(0.7)"/>
    </g>
  </g>
</svg>
